<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram Archiver</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    * { font-family: 'Inter', sans-serif; }
    .gradient-bg {
      background: linear-gradient(135deg, #833ab4 0%, #fd1d1d 50%, #fcb045 100%);
    }
    .gradient-text {
      background: linear-gradient(135deg, #833ab4 0%, #fd1d1d 50%, #fcb045 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .gradient-btn {
      background: linear-gradient(135deg, #833ab4 0%, #fd1d1d 60%, #fcb045 100%);
      transition: opacity 0.2s, transform 0.1s;
    }
    .gradient-btn:hover { opacity: 0.92; transform: translateY(-1px); }
    .gradient-btn:active { transform: translateY(0); }
    .gradient-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .card { box-shadow: 0 20px 60px rgba(131,58,180,0.12), 0 4px 16px rgba(0,0,0,0.08); }
    .input-focus:focus { border-color: #833ab4; box-shadow: 0 0 0 3px rgba(131,58,180,0.15); outline: none; }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4" style="background: linear-gradient(160deg, #fdf0ff 0%, #fff0f0 50%, #fffbf0 100%);">

  <!-- Card -->
  <div class="bg-white rounded-3xl card w-full max-w-md p-8 relative">

    <!-- Logo / Icon -->
    <div class="flex justify-center mb-6">
      <div class="gradient-bg w-16 h-16 rounded-2xl flex items-center justify-center shadow-lg">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5" stroke="white" fill="none" stroke-width="1.8"/>
          <circle cx="12" cy="12" r="4" stroke="white" fill="none" stroke-width="1.8"/>
          <circle cx="17.5" cy="6.5" r="1" fill="white"/>
        </svg>
      </div>
    </div>

    <!-- Title -->
    <div class="text-center mb-7">
      <h1 class="text-3xl font-800 font-extrabold gradient-text mb-1">Instagram Archiver</h1>
      <p class="text-gray-400 text-sm">Download reels &amp; stories instantly</p>
    </div>

    <!-- Input -->
    <div class="mb-4">
      <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Paste Instagram URL</label>
      <div class="relative">
        <div class="absolute inset-y-0 left-3 flex items-center pointer-events-none">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
          </svg>
        </div>
        <input
          id="urlInput"
          type="url"
          placeholder="https://www.instagram.com/reel/..."
          class="w-full border border-gray-200 rounded-xl pl-10 pr-4 py-3 text-sm bg-gray-50 input-focus transition-all"
        />
      </div>
    </div>

    <!-- Button -->
    <button
      id="downloadBtn"
      onclick="downloadVideo()"
      class="gradient-btn w-full text-white font-semibold py-3.5 rounded-xl text-sm flex items-center justify-center gap-2"
    >
      <svg id="btnIcon" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5m0 0l5-5m-5 5V4"/>
      </svg>
      <span id="btnText">Download</span>
    </button>

    <!-- Status Messages -->
    <div id="statusBox" class="mt-4 hidden fade-in">
      <!-- Loading -->
      <div id="loadingMsg" class="hidden items-center gap-3 bg-purple-50 border border-purple-200 rounded-xl px-4 py-3">
        <svg class="spin w-4 h-4 text-purple-500 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
        </svg>
        <span class="text-sm text-purple-700 font-medium">Fetching video, please wait…</span>
      </div>
      <!-- Error -->
      <div id="errorMsg" class="hidden items-center gap-3 bg-red-50 border border-red-200 rounded-xl px-4 py-3">
        <svg class="w-4 h-4 text-red-500 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><path stroke-linecap="round" d="M12 8v4m0 4h.01"/>
        </svg>
        <span id="errorText" class="text-sm text-red-600"></span>
      </div>
      <!-- Success -->
      <div id="successMsg" class="hidden items-center gap-3 bg-green-50 border border-green-200 rounded-xl px-4 py-3">
        <svg class="w-4 h-4 text-green-500 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
        </svg>
        <span class="text-sm text-green-700 font-medium">Download started! Check your downloads folder.</span>
      </div>
    </div>

    <!-- Divider -->
    <div class="flex items-center gap-3 my-6">
      <div class="flex-1 h-px bg-gray-100"></div>
      <span class="text-xs text-gray-300 font-medium">SUPPORTS</span>
      <div class="flex-1 h-px bg-gray-100"></div>
    </div>

    <!-- Supports badges -->
    <div class="flex justify-center gap-3">
      <span class="flex items-center gap-1.5 text-xs text-gray-500 bg-gray-50 border border-gray-200 rounded-full px-3 py-1.5 font-medium">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-pink-500" fill="currentColor" viewBox="0 0 24 24"><path d="M8 2C4.7 2 2 4.7 2 8v8c0 3.3 2.7 6 6 6h8c3.3 0 6-2.7 6-6V8c0-3.3-2.7-6-6-6H8zm0 2h8c2.2 0 4 1.8 4 4v8c0 2.2-1.8 4-4 4H8c-2.2 0-4-1.8-4-4V8c0-2.2 1.8-4 4-4zm8 1.5a1 1 0 100 2 1 1 0 000-2zM12 7a5 5 0 100 10A5 5 0 0012 7zm0 2a3 3 0 110 6 3 3 0 010-6z"/></svg>
        Reels
      </span>
      <span class="flex items-center gap-1.5 text-xs text-gray-500 bg-gray-50 border border-gray-200 rounded-full px-3 py-1.5 font-medium">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-purple-500" fill="currentColor" viewBox="0 0 24 24"><path d="M8 2C4.7 2 2 4.7 2 8v8c0 3.3 2.7 6 6 6h8c3.3 0 6-2.7 6-6V8c0-3.3-2.7-6-6-6H8zm0 2h8c2.2 0 4 1.8 4 4v8c0 2.2-1.8 4-4 4H8c-2.2 0-4-1.8-4-4V8c0-2.2 1.8-4 4-4zm8 1.5a1 1 0 100 2 1 1 0 000-2zM12 7a5 5 0 100 10A5 5 0 0012 7zm0 2a3 3 0 110 6 3 3 0 010-6z"/></svg>
        Stories
      </span>
      <span class="flex items-center gap-1.5 text-xs text-gray-500 bg-gray-50 border border-gray-200 rounded-full px-3 py-1.5 font-medium">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-orange-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.277A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M3 8a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/></svg>
        Posts
      </span>
    </div>

  </div>

  <!-- Footer -->
  <p class="mt-5 text-xs text-gray-400">
    Developed by <span class="font-semibold gradient-text">Yogesh Mahawar</span> &nbsp;·&nbsp; For personal archiving only
  </p>

  <script>
    async function downloadVideo() {
      const url = document.getElementById('urlInput').value.trim();
      const btn = document.getElementById('downloadBtn');
      const btnText = document.getElementById('btnText');
      const btnIcon = document.getElementById('btnIcon');
      const statusBox = document.getElementById('statusBox');
      const loadingMsg = document.getElementById('loadingMsg');
      const errorMsg = document.getElementById('errorMsg');
      const errorText = document.getElementById('errorText');
      const successMsg = document.getElementById('successMsg');

      if (!url) {
        showError('Please paste an Instagram URL first.');
        return;
      }

      // Loading state
      statusBox.classList.remove('hidden');
      [loadingMsg, errorMsg, successMsg].forEach(el => el.classList.add('hidden'));
      loadingMsg.classList.remove('hidden');
      loadingMsg.classList.add('flex');
      btn.disabled = true;
      btnText.textContent = 'Downloading…';
      btnIcon.innerHTML = `<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>`;
      btnIcon.classList.add('spin');

      try {
        const response = await fetch('/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });

        if (!response.ok) {
          const data = await response.json();
          throw new Error(data.detail || 'Download failed');
        }

        const blob = await response.blob();
        const disposition = response.headers.get('content-disposition') || '';
        const match = disposition.match(/filename="?([^"]+)"?/);
        const filename = match ? match[1] : 'instagram_video.mp4';

        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        a.click();
        URL.revokeObjectURL(a.href);

        loadingMsg.classList.add('hidden');
        successMsg.classList.remove('hidden');
        successMsg.classList.add('flex');
      } catch (err) {
        showError(err.message);
      } finally {
        btn.disabled = false;
        btnText.textContent = 'Download';
        btnIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5m0 0l5-5m-5 5V4"/>`;
        btnIcon.classList.remove('spin');
      }
    }

    function showError(msg) {
      const statusBox = document.getElementById('statusBox');
      const loadingMsg = document.getElementById('loadingMsg');
      const errorMsg = document.getElementById('errorMsg');
      const errorText = document.getElementById('errorText');
      statusBox.classList.remove('hidden');
      loadingMsg.classList.add('hidden');
      errorText.textContent = msg;
      errorMsg.classList.remove('hidden');
      errorMsg.classList.add('flex');
    }

    document.getElementById('urlInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') downloadVideo();
    });
  </script>
</body>
</html>
